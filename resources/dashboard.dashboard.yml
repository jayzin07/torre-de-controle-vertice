# Dashboard AI/BI do Projeto Farol. O JSON é gerado por scripts/gerar_dashboard.py:
# não edite o .lvdash.json à mão, edite o script e rode de novo.
resources:
  dashboards:
    dashboard_portfolio:
      display_name: "Projeto Farol · Portfólio"
      file_path: ./dashboard-portfolio.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # as queries da gold usam o nome puro da tabela; o catálogo e o schema vêm daqui
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
